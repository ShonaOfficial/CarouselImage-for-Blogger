<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopSKW - Ultimate Carousel Showcase</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Plus Jakarta Sans','sans-serif']}}}}</script>

<!-- CSS dari GitHub (ganti USERNAME & REPO) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ShonaOfficial/CarouselImage-for-Blogger@v0.0.2/src/style.css">

<!-- ============ PENGATURAN UTAMA ============
     ACTIVE_STYLE: 1 = Stacked Depth | 2 = Coverflow | 3 = Floating Glow | 4 = Minimalist Stack -->
<script>
  window.SHOPSKW_CONFIG = {
    ACTIVE_STYLE: 4,
    AUTOPLAY: true,
    INTERVAL: 4000
  };
</script>
</head>
<body class="flex flex-col items-center justify-between min-h-screen py-4 px-3 sm:px-4">

<header class="w-full max-w-4xl glass-panel rounded-3xl p-3.5 flex flex-col sm:flex-row items-center justify-between mb-4 gap-3">
  <div class="flex items-center space-x-2.5">
    <div class="w-9 h-9 rounded-2xl bg-gradient-to-br from-purple-600 via-indigo-600 to-pink-500 flex items-center justify-center text-white shadow-md shadow-purple-500/30"><i class="fa-solid fa-wand-magic-sparkles text-xs"></i></div>
    <div>
      <h1 class="font-bold text-gray-800 text-sm leading-none flex items-center gap-1">ShopSKW <span class="text-[9px] bg-purple-600 text-white px-1.5 py-0.5 rounded-full font-semibold">SHOWCASE</span></h1>
      <p class="text-[11px] text-gray-500 font-medium mt-0.5">4 Gaya Carousel & Viewport Switcher</p>
    </div>
  </div>
  <div class="flex items-center bg-white/90 p-1.5 rounded-2xl border border-white shadow-sm w-full sm:w-auto justify-center">
    <button onclick="setViewport('smartphone')" id="btnSmart" class="flex-1 sm:flex-none px-4 py-1.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 bg-purple-600 text-white shadow-sm"><i class="fa-solid fa-mobile-screen text-xs"></i> Smartphone Mode</button>
    <button onclick="setViewport('desktop')" id="btnDesk" class="flex-1 sm:flex-none px-4 py-1.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 text-gray-600 hover:text-purple-700"><i class="fa-solid fa-desktop text-xs"></i> Desktop Mode</button>
  </div>
</header>

<main id="viewportWrapper" class="my-auto flex flex-col items-center">
  <div class="w-full grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3">
    <button onclick="switchStyle(1)" id="styleTab1" class="py-2 px-2.5 rounded-2xl text-[11px] font-bold"><i class="fa-solid fa-clone text-[10px]"></i> 1. Stacked Depth</button>
    <button onclick="switchStyle(2)" id="styleTab2" class="py-2 px-2.5 rounded-2xl text-[11px] font-bold"><i class="fa-solid fa-film text-[10px]"></i> 2. Coverflow Flow</button>
    <button onclick="switchStyle(3)" id="styleTab3" class="py-2 px-2.5 rounded-2xl text-[11px] font-bold"><i class="fa-solid fa-fire text-[10px]"></i> 3. Floating Glow</button>
    <button onclick="switchStyle(4)" id="styleTab4" class="py-2 px-2.5 rounded-2xl text-[11px] font-bold"><i class="fa-solid fa-layer-group text-[10px]"></i> 4. Minimalist Stack</button>
  </div>

  <div class="w-full glass-panel rounded-3xl p-3.5 flex items-center justify-between mb-3">
    <div class="flex items-center space-x-3">
      <button class="w-9 h-9 rounded-2xl bg-white/90 text-purple-900 flex items-center justify-center shadow-sm"><i class="fa-solid fa-bars text-sm"></i></button>
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 rounded-2xl bg-gradient-to-br from-purple-600 via-indigo-600 to-pink-500 flex items-center justify-center text-white shadow-md"><i class="fa-solid fa-bag-shopping text-xs"></i></div>
        <div>
          <h2 class="font-bold text-gray-800 text-sm leading-none flex items-center gap-1">ShopSKW <span class="text-[9px] bg-purple-600 text-white px-1.5 py-0.5 rounded-full font-semibold">ID</span></h2>
          <p class="text-[11px] text-gray-500 font-medium mt-0.5">Gadget & Gaya Hidup</p>
        </div>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <button class="w-9 h-9 rounded-2xl bg-white/90 text-purple-900 flex items-center justify-center shadow-sm"><i class="fa-solid fa-magnifying-glass text-xs"></i></button>
      <button class="w-9 h-9 rounded-2xl bg-white/90 text-purple-900 flex items-center justify-center shadow-sm relative"><i class="fa-regular fa-bell text-xs"></i><span class="absolute top-2 right-2 w-2 h-2 bg-pink-500 rounded-full ring-2 ring-white"></span></button>
    </div>
  </div>

  <div class="w-full text-center mb-3 px-1">
    <p class="text-xs font-semibold text-purple-900 bg-white/70 backdrop-blur-md py-2 px-3.5 rounded-2xl border border-white shadow-sm">✨ <span id="descTitle"></span></p>
  </div>

  <div class="w-full relative mb-4">
    <div id="stageContainer1" class="hidden"><div class="carousel-stage"><div class="relative w-full h-full" id="cards1"></div></div></div>
    <div id="stageContainer2" class="hidden"><div class="carousel-stage s2-stage"><div class="relative w-full h-full flex items-center justify-center" id="cards2"></div></div></div>
    <div id="stageContainer3" class="hidden"><div class="carousel-stage"><div class="relative w-full h-full" id="cards3"></div></div></div>
    <div id="stageContainer4" class="hidden"><div class="carousel-stage"><div class="relative w-full h-full" id="cards4"></div></div></div>

    <button onclick="prevSlide()" class="absolute -left-3.5 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/90 backdrop-blur-md text-purple-900 flex items-center justify-center shadow-lg z-40 hover:bg-white transition"><i class="fa-solid fa-chevron-left text-xs"></i></button>
    <button onclick="nextSlide()" class="absolute -right-3.5 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/90 backdrop-blur-md text-purple-900 flex items-center justify-center shadow-lg z-40 hover:bg-white transition"><i class="fa-solid fa-chevron-right text-xs"></i></button>
  </div>

  <div class="w-full flex items-center justify-between glass-panel px-4 py-2.5 rounded-full shadow-sm">
    <div class="flex items-center space-x-1.5">
      <button class="indicator-dot h-2 w-6 rounded-full bg-purple-700 transition-all duration-300" onclick="goToSlide(0)"></button>
      <button class="indicator-dot h-2 w-2 rounded-full bg-purple-300 transition-all duration-300" onclick="goToSlide(1)"></button>
      <button class="indicator-dot h-2 w-2 rounded-full bg-purple-300 transition-all duration-300" onclick="goToSlide(2)"></button>
      <button class="indicator-dot h-2 w-2 rounded-full bg-purple-300 transition-all duration-300" onclick="goToSlide(3)"></button>
    </div>
    <button onclick="toggleAutoPlay()" id="playPauseBtn" class="px-3 py-1 rounded-full bg-white hover:bg-purple-50 text-purple-900 text-xs font-semibold transition border border-purple-200 shadow-sm"></button>
  </div>
</main>

<nav class="w-full max-w-4xl glass-panel rounded-3xl p-3.5 flex justify-around items-center mt-4">
  <a href="#" class="text-purple-900"><i class="fa-solid fa-house text-sm"></i></a>
  <a href="#" class="text-gray-400 hover:text-purple-600 transition"><i class="fa-solid fa-magnifying-glass text-sm"></i></a>
  <a href="#" class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-purple-600 to-pink-500 text-white flex items-center justify-center shadow-md shadow-purple-500/30 -translate-y-2"><i class="fa-solid fa-border-all text-sm"></i></a>
  <a href="#" class="text-gray-400 hover:text-purple-600 transition"><i class="fa-solid fa-shirt text-sm"></i></a>
  <a href="#" class="text-gray-400 hover:text-purple-600 transition"><i class="fa-solid fa-user text-sm"></i></a>
</nav>

<!-- JS dari GitHub (ganti USERNAME & REPO) -->
<script src="https://cdn.jsdelivr.net/gh/ShonaOfficial/CarouselImage-for-Blogger@v0.0.2/src/script.js"></script>
</body>
</html>
